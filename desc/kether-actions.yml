"TabooLib:case & when":
  id: "case & when"
  name: "Case & When"
  desc: "一种复杂的选择语句, 相比于 #IF 有更丰富的特性。<br>完整的选择语句需要包含至少一项选择分支, 也就是 {when block}。<br><br>每个标准的选择分支由 {when} {{条件}} -> {{表达式}} 组成。<br>也可使用 {else} {{表达}} 作为默认分支。<br><br>{先看一段示例:}<br>set number to 3<br>set numberProvided to case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> \"One\"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> \"Two\"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> \"Three\"<br>&nbsp;&nbsp;&nbsp;&nbsp;else \"One\"<br>]<br>log inline \"You provide {{ &numberProvided }}\"<br><br>{运行后得到结果:}<br>You provide Three<br><br>{也可以像其他语句一样正常使用:}<br>set number to 3<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> log \"One\"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 2 -> log \"Two\"<br>&nbsp;&nbsp;&nbsp;&nbsp;when 3 -> log \"Three\"<br>&nbsp;&nbsp;&nbsp;&nbsp;else log \"One\"<br>]<br><br>{或是包含多条语句:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when 1 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log \"Monday\"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log \"First day of the week\"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when [ 2 3 4 5 6 7 ] -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log \"Sunday\"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log \"Other days\"<br>]<br><br>{或是进行逻辑判断:}<br>set number to 1<br>case &number [<br>&nbsp;&nbsp;&nbsp;&nbsp;when < 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log \"Small\"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;when > 10 -> {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;log \"Big\"<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;else log \"Other\"<br>]"
  syntax: "case {action} [ {when block} ... ]"
  example: "case &mat [<br>&nbsp;&nbsp;&nbsp;&nbsp;when \"diamond\" -> 1<br>&nbsp;&nbsp;&nbsp;&nbsp;when [ \"iron\", \"gold\" ] -> 2<br>&nbsp;&nbsp;&nbsp;&nbsp;else false<br>]"
  semantic: "条件分支 {0} 匹配 {1}"

"TabooLib:check":
  id: "check"
  name: "Check"
  desc: "将两个动作的{返回值}进行对比，支持多种判定方式。<br><br>1. 等于（{==}、{is}）：指两个值{字面意思}上相同。<br>2. 不等于（{!=}、{not}）：指两个值{字面意思}上不同。<br>3. 相似等于（{=?}、{is?}）：指两个值{字面意思}上{忽略大小写}的条件下相同。<br>4. 绝对等于（{=!}、{is!}）：指两个值{内存路径}上相同。<br>5. 大于（{>}、{gt}）：指第一个值{大于}第二个值。<br>6. 大于等于（{>=}）：指第一个值{大于}或{等于}第二个值。<br>7. 小于（{<}、{lt}）：指第一个值{小于}第二个值。<br>8. 小于等于（{<=}）：指第一个值{小于}或{等于}第二个值。<br>9. 右含左(in)：第二个值是否含有第一个值的内容。<br>10. 左含右(has)：第一个值是否含有第二个值的内容。<br><br>{注意：}<br>在使用{等于}条件进行判断时，左右两个参数会自动附加 {#Type} 类型推断动作。"
  syntax: "check {action} {symbol} {action}"
  example: "if check 1 is 1 then print yes else print no<br>if check 2 gt 1 then print yes else print no<br>if check 2 lt 1 then print yes else print no"
  semantic: "检查 {0} {1} {2}"

